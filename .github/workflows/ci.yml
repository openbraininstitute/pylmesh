name: CI - pylmesh

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [build-wheels-linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v8
        with:
          name: cibw-wheels-linux-x86_64
          path: dist/

      - name: Install wheel and test dependencies
        run: |
          pip install dist/*.whl
          pip install pytest

      - name: Run tests
        run: pytest tests -v

  build-wheels-linux:
    name: Build wheels (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            cibw_build: cp312-manylinux_x86_64
            manylinux_image_env: CIBW_MANYLINUX_X86_64_IMAGE
          - arch: aarch64
            runner: ubuntu-24.04-arm
            cibw_build: cp312-manylinux_aarch64
            manylinux_image_env: CIBW_MANYLINUX_AARCH64_IMAGE

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          ${{ matrix.manylinux_image_env }}: manylinux_2_28

          CIBW_BEFORE_ALL: |
            set -euxo pipefail

            dnf install -y epel-release
            dnf install -y hdf5-devel libomp-devel

            cd /tmp
            git clone --depth 1 https://github.com/g-truc/glm.git
            cp -r glm/glm /usr/local/include/
            rm -rf glm

            git clone --depth 1 https://github.com/nlohmann/json.git
            cd json
            cmake -DCMAKE_INSTALL_PREFIX=/usr/local -DJSON_BuildTests=OFF .
            cmake --install .
            cd /tmp && rm -rf json

            git clone --depth 1 --branch 1.5.7 https://github.com/google/draco.git
            cd draco
            mkdir build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=/usr/local -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DDRACO_TESTS=OFF ..
            cmake --build . --config Release -j$(nproc)
            cmake --install .
            cd /tmp && rm -rf draco

            ldconfig

          CIBW_BEFORE_BUILD: |
            pip install --upgrade pip
            pip install nanobind scikit-build-core typing_extensions
            NANOBIND_CMAKE_DIR=$(python -c "import nanobind; print(nanobind.cmake_dir())")
            echo "set(CMAKE_PREFIX_PATH \"/usr/local;${NANOBIND_CMAKE_DIR}\" CACHE STRING \"\" FORCE)" > /tmp/nanobind_prefix.cmake

          CIBW_ENVIRONMENT: >
            CMAKE_PREFIX_PATH="/usr/local"
            SKBUILD_CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=/tmp/nanobind_prefix.cmake"

          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI and GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Download Linux wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-linux*
          merge-multiple: true
          path: dist/

      - name: Build sdist
        run: |
          python -m build --sdist --outdir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true